name: Theme layer

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/internal/theme/**'
      - 'backend/internal/**/theme*.go'
      - 'backend/internal/server/routes/admin.go'
      - 'backend/go.*'
      - 'tools/themes/**'
      - '.github/workflows/themes.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/internal/theme/**'
      - 'backend/internal/**/theme*.go'
      - 'backend/internal/server/routes/admin.go'
      - 'backend/go.*'
      - 'tools/themes/**'
      - '.github/workflows/themes.yml'

permissions:
  contents: read

concurrency:
  group: themes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Theme package and HTTP contracts
        working-directory: backend
        run: |
          go test ./internal/theme
          go test -tags=unit ./internal/service ./internal/handler/admin ./internal/handler ./internal/server/routes -run '^(TestThemes|TestAdminTheme|TestGetActiveThemePublic|TestThemeRoutes)' -count=1
      - name: Compile server
        working-directory: backend
        run: go build -o /tmp/sub2api-theme-check ./cmd/server
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Theme and integration regressions
        working-directory: frontend
        run: |
          pnpm exec vitest run src/features/themes src/router/__tests__ src/components/layout/__tests__/AppSidebar.spec.ts
          node --test themes/tailwind.test.mjs
      - name: Production build and translation contract
        working-directory: frontend
        run: pnpm build
